<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#0b1120"/>
  <text x="40" y="52" fill="#e2e8f0" font-size="26" font-weight="700">Linkly on Kubernetes — architecture</text>
  <text x="40" y="80" fill="#94a3b8" font-size="15">Terraform provisions the cluster and Helm add-ons · Kustomize deploys the app (dev / prod overlays)</text>

  <!-- cluster boundary -->
  <rect x="150" y="110" width="1010" height="370" rx="16" fill="none" stroke="#334155" stroke-dasharray="6 6"/>
  <text x="170" y="136" fill="#64748b" font-size="13" font-family="monospace">Kubernetes cluster · app namespaces: Pod Security "restricted" + default-deny NetworkPolicies</text>

  <!-- user -->
  <rect x="30" y="220" width="100" height="70" rx="12" fill="#111827" stroke="#475569"/>
  <text x="80" y="252" fill="#e2e8f0" font-size="15" text-anchor="middle" font-weight="600">User</text>
  <text x="80" y="272" fill="#94a3b8" font-size="12" text-anchor="middle">browser</text>

  <!-- ingress -->
  <rect x="180" y="205" width="170" height="100" rx="12" fill="#0f172a" stroke="#38bdf8"/>
  <text x="265" y="240" fill="#e2e8f0" font-size="15" text-anchor="middle" font-weight="600">ingress-nginx</text>
  <text x="265" y="262" fill="#94a3b8" font-size="12" text-anchor="middle">Helm · TLS-ready</text>
  <text x="265" y="282" fill="#94a3b8" font-size="12" text-anchor="middle">(cert-manager in prod)</text>

  <!-- web -->
  <rect x="390" y="190" width="190" height="130" rx="12" fill="#0f172a" stroke="#38bdf8"/>
  <text x="485" y="224" fill="#e2e8f0" font-size="15" text-anchor="middle" font-weight="600">web</text>
  <text x="485" y="246" fill="#94a3b8" font-size="12" text-anchor="middle">nginx-unprivileged</text>
  <text x="485" y="266" fill="#94a3b8" font-size="12" text-anchor="middle">2 replicas · non-root</text>
  <text x="485" y="286" fill="#94a3b8" font-size="12" text-anchor="middle">/metrics → 404</text>

  <!-- api -->
  <rect x="620" y="175" width="230" height="160" rx="12" fill="#0f172a" stroke="#38bdf8"/>
  <text x="735" y="208" fill="#e2e8f0" font-size="15" text-anchor="middle" font-weight="600">api</text>
  <text x="735" y="230" fill="#94a3b8" font-size="12" text-anchor="middle">Express 5 · TypeScript</text>
  <text x="735" y="250" fill="#94a3b8" font-size="12" text-anchor="middle">HPA 2 → 6 pods (CPU)</text>
  <text x="735" y="270" fill="#94a3b8" font-size="12" text-anchor="middle">startup / liveness / readiness</text>
  <text x="735" y="290" fill="#94a3b8" font-size="12" text-anchor="middle">PodDisruptionBudget</text>
  <text x="735" y="310" fill="#94a3b8" font-size="12" text-anchor="middle">graceful shutdown on SIGTERM</text>

  <!-- postgres -->
  <rect x="900" y="205" width="230" height="100" rx="12" fill="#0f172a" stroke="#38bdf8"/>
  <text x="1015" y="240" fill="#e2e8f0" font-size="15" text-anchor="middle" font-weight="600">PostgreSQL</text>
  <text x="1015" y="262" fill="#94a3b8" font-size="12" text-anchor="middle">StatefulSet + PVC</text>
  <text x="1015" y="282" fill="#94a3b8" font-size="12" text-anchor="middle">(managed DB in the cloud)</text>

  <path d="M130 255H176" stroke="#7dd3fc" stroke-width="2" marker-end="url(#a)"/>
  <path d="M350 255H386" stroke="#7dd3fc" stroke-width="2" marker-end="url(#a)"/>
  <path d="M580 255H616" stroke="#7dd3fc" stroke-width="2" marker-end="url(#a)"/>
  <path d="M850 255H896" stroke="#7dd3fc" stroke-width="2" marker-end="url(#a)"/>

  <!-- monitoring -->
  <rect x="560" y="375" width="250" height="80" rx="12" fill="#1c1917" stroke="#fbbf24"/>
  <text x="685" y="405" fill="#fde68a" font-size="15" text-anchor="middle" font-weight="600">Prometheus</text>
  <text x="685" y="427" fill="#a8a29e" font-size="12" text-anchor="middle">ServiceMonitor · alert rules</text>
  <rect x="860" y="375" width="250" height="80" rx="12" fill="#1c1917" stroke="#fbbf24"/>
  <text x="985" y="405" fill="#fde68a" font-size="15" text-anchor="middle" font-weight="600">Grafana</text>
  <text x="985" y="427" fill="#a8a29e" font-size="12" text-anchor="middle">dashboard as code (JSON)</text>
  <path d="M735 371V339" stroke="#fbbf24" stroke-width="2" marker-end="url(#g)"/>
  <text x="745" y="360" fill="#a8a29e" font-size="11">scrapes /metrics</text>
  <path d="M810 415H856" stroke="#fbbf24" stroke-width="2" marker-end="url(#g)"/>

  <!-- CI -->
  <text x="40" y="535" fill="#e2e8f0" font-size="18" font-weight="700">CI/CD pipeline — GitHub Actions, on every push</text>
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="560" width="200" height="100" rx="12" fill="#111827" stroke="#475569"/>
    <text x="140" y="595" fill="#e2e8f0" font-weight="600">API tests</text>
    <text x="140" y="617" fill="#94a3b8" font-size="12">typecheck · vitest</text>
    <text x="140" y="637" fill="#94a3b8" font-size="12">+ real PostgreSQL</text>

    <rect x="270" y="560" width="200" height="100" rx="12" fill="#111827" stroke="#475569"/>
    <text x="370" y="595" fill="#e2e8f0" font-weight="600">Validate manifests</text>
    <text x="370" y="617" fill="#94a3b8" font-size="12">kustomize build</text>
    <text x="370" y="637" fill="#94a3b8" font-size="12">kubeconform (37 resources)</text>

    <rect x="500" y="560" width="200" height="100" rx="12" fill="#111827" stroke="#475569"/>
    <text x="600" y="595" fill="#e2e8f0" font-weight="600">Terraform</text>
    <text x="600" y="617" fill="#94a3b8" font-size="12">fmt · validate</text>
    <text x="600" y="637" fill="#94a3b8" font-size="12">kind + Helm add-ons</text>

    <rect x="730" y="560" width="200" height="100" rx="12" fill="#111827" stroke="#475569"/>
    <text x="830" y="595" fill="#e2e8f0" font-weight="600">Images</text>
    <text x="830" y="617" fill="#94a3b8" font-size="12">multi-stage Docker build</text>
    <text x="830" y="637" fill="#94a3b8" font-size="12">Trivy scan → GHCR</text>

    <rect x="960" y="560" width="200" height="100" rx="12" fill="#111827" stroke="#475569"/>
    <text x="1060" y="595" fill="#e2e8f0" font-weight="600">Deploy (kind)</text>
    <text x="1060" y="617" fill="#94a3b8" font-size="12">smoke test via web tier</text>
    <text x="1060" y="637" fill="#94a3b8" font-size="12">zero-downtime rollout</text>
  </g>
  <path d="M240 610H266M470 610H496M700 610H726M930 610H956" stroke="#7dd3fc" stroke-width="2" marker-end="url(#a)"/>
</svg>
