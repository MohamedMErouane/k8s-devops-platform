apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: linkly-dev

resources:
  - namespace.yaml
  - ../../base

# Dev runs one replica of everything to fit on a laptop / CI runner.
patches:
  - target: { kind: Deployment, name: linkly-api }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: HorizontalPodAutoscaler, name: linkly-api }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target: { kind: Deployment, name: linkly-web }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: PodDisruptionBudget, name: linkly-api }
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0

configMapGenerator:
  - name: linkly-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug

images:
  # CI builds and loads images tagged "ci" straight into the kind cluster.
  - name: ghcr.io/mohamedmerouane/linkly-api
    newTag: ci
  - name: ghcr.io/mohamedmerouane/linkly-web
    newTag: ci
