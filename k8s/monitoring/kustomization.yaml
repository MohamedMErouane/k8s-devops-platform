# Applied after kube-prometheus-stack is installed (it provides the CRDs).
#   kubectl apply -k k8s/monitoring
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: linkly-dev

resources:
  - service-monitor.yaml
  - alerts.yaml

configMapGenerator:
  - name: linkly-grafana-dashboard
    files:
      - linkly-dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"   # picked up by the Grafana sidecar (searchNamespace: ALL)
