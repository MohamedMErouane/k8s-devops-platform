apiVersion: v1
kind: ServiceAccount
metadata:
  name: linkly-api
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkly-api
  labels:
    app.kubernetes.io/name: linkly-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: linkly-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # zero-downtime: never drop below desired capacity
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linkly-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: linkly-api
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: linkly-api
      containers:
        - name: api
          image: ghcr.io/mohamedmerouane/linkly-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: linkly-db
                  key: DATABASE_URL
          envFrom:
            - configMapRef:
                name: linkly-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            # Give kube-proxy / ingress time to remove this pod from endpoints
            # before the app starts draining connections.
            preStop:
              exec:
                command: ["sleep", "5"]
---
apiVersion: v1
kind: Service
metadata:
  name: linkly-api
  labels:
    app.kubernetes.io/name: linkly-api
spec:
  selector:
    app.kubernetes.io/name: linkly-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: linkly-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: linkly-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: linkly-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: linkly-api
