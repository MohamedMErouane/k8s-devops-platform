apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkly
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "16k"
spec:
  ingressClassName: nginx
  rules:
    - host: linkly.localtest.me   # resolves to 127.0.0.1, handy with kind
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: linkly-web
                port:
                  name: http
