<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Linkly — URL shortener</title>
  <style>
    :root { --bg:#0b1020; --panel:#121933; --ink:#e7ecf7; --muted:#8b94ac; --accent:#38bdf8; --primary:#2563eb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--ink); }
    main { max-width: 720px; margin: 0 auto; padding: 64px 16px; }
    h1 { font-size: 2.2rem; margin: 0 0 6px; } p.lead { color: var(--muted); margin: 0 0 32px; }
    form { display:flex; gap:8px; flex-wrap:wrap; }
    input { flex:1 1 260px; padding:12px 14px; border-radius:10px; border:1px solid #243052; background:var(--panel); color:var(--ink); font-size:1rem; }
    input#code { flex:0 1 160px; }
    button { padding:12px 18px; border:0; border-radius:10px; background:var(--primary); color:#fff; font-weight:600; cursor:pointer; }
    #result { margin:16px 0; min-height:1.5em; } #result a { color: var(--accent); }
    .err { color:#f87171; }
    table { width:100%; border-collapse: collapse; margin-top:24px; font-size:.92rem; }
    th, td { text-align:left; padding:10px 8px; border-bottom:1px solid #1d2647; }
    th { color: var(--muted); font-weight:500; } td.url { max-width: 320px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    footer { margin-top:40px; color:var(--muted); font-size:.8rem; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <main>
    <h1>Linkly</h1>
    <p class="lead">A tiny URL shortener — the demo workload for the k8s-devops-platform.</p>
    <form id="f">
      <input id="url" type="url" placeholder="https://example.com/a-very-long-link" required />
      <input id="code" placeholder="custom code (optional)" />
      <button>Shorten</button>
    </form>
    <div id="result"></div>
    <table>
      <thead><tr><th>Code</th><th>Target</th><th>Clicks</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <footer id="ver"></footer>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    async function load() {
      const res = await fetch("/api/links");
      const links = res.ok ? await res.json() : [];
      $("rows").innerHTML = links.map((l) =>
        `<tr><td><a href="/${esc(l.code)}" style="color:var(--accent)">${esc(l.code)}</a></td><td class="url">${esc(l.url)}</td><td>${esc(l.clicks)}</td></tr>`
      ).join("");
    }
    $("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const body = { url: $("url").value };
      if ($("code").value.trim()) body.code = $("code").value.trim();
      const res = await fetch("/api/links", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
      const data = await res.json();
      const link = location.origin + "/" + data.code;
      $("result").innerHTML = res.ok
        ? `Short link: <a href="${esc(link)}">${esc(link)}</a>`
        : `<span class="err">${esc(data.error)}</span>`;
      if (res.ok) { $("url").value = ""; $("code").value = ""; load(); }
    });
    fetch("/healthz").then((r) => r.json()).then((h) => { $("ver").textContent = "api " + h.version; }).catch(() => {});
    load();
  </script>
</body>
</html>
