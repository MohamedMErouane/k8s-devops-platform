name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/mohamedmerouane

jobs:
  # ── 1. Application: typecheck + integration tests against real Postgres ──
  test:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linkly
          POSTGRES_PASSWORD: linkly
          POSTGRES_DB: linkly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U linkly" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: app/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          DATABASE_URL: postgres://linkly:linkly@localhost:5432/linkly

  # ── 2. Kubernetes manifests: render every overlay and validate against schemas ──
  manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Render & validate overlays
        run: |
          for overlay in k8s/overlays/dev k8s/overlays/prod; do
            echo "::group::$overlay"
            kubectl kustomize "$overlay" | kubeconform -strict -summary -kubernetes-version 1.31.0
            echo "::endgroup::"
          done
      - name: Validate monitoring (CRDs from the datree catalog)
        run: |
          kubectl kustomize k8s/monitoring | kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  # ── 3. Infrastructure as code ──
  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  # ── 4. Build images, scan for vulnerabilities, push to GHCR on main ──
  images:
    name: Build, scan & publish images
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: app/${{ matrix.component }}
          load: true
          tags: linkly-${{ matrix.component }}:scan
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: linkly-${{ matrix.component }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: app/${{ matrix.component }}
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/linkly-${{ matrix.component }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/linkly-${{ matrix.component }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.component }}

  # ── 5. Deploy to a real Kubernetes cluster (kind) and run end-to-end checks ──
  e2e:
    name: Deploy to Kubernetes (kind) + smoke test
    needs: [test, manifests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: linkly-ci
      - name: Build images and load them into the cluster
        run: |
          docker build -t ghcr.io/mohamedmerouane/linkly-api:ci --build-arg APP_VERSION=${{ github.sha }} app/api
          docker build -t ghcr.io/mohamedmerouane/linkly-web:ci app/web
          kind load docker-image ghcr.io/mohamedmerouane/linkly-api:ci --name linkly-ci
          kind load docker-image ghcr.io/mohamedmerouane/linkly-web:ci --name linkly-ci
      - name: Deploy dev overlay
        run: |
          kubectl apply -k k8s/overlays/dev
          kubectl -n linkly-dev rollout status statefulset/postgres --timeout=180s
          kubectl -n linkly-dev rollout status deployment/linkly-api --timeout=180s
          kubectl -n linkly-dev rollout status deployment/linkly-web --timeout=120s
      - name: Smoke test through the web tier
        run: |
          kubectl -n linkly-dev port-forward svc/linkly-web 8080:80 >/tmp/pf.log 2>&1 &
          sleep 3
          BASE_URL=http://localhost:8080 ./scripts/smoke-test.sh
      - name: Zero-downtime rolling restart
        run: |
          # Hammer the API while every pod is replaced; any failed request fails the job.
          kubectl -n linkly-dev scale deployment/linkly-api --replicas=2
          kubectl -n linkly-dev rollout status deployment/linkly-api --timeout=120s
          ( fails=0; for i in $(seq 1 150); do
              curl -fs -o /dev/null http://localhost:8080/api/links || fails=$((fails+1)); sleep 0.2;
            done; echo $fails > /tmp/fails ) &
          load=$!
          kubectl -n linkly-dev rollout restart deployment/linkly-api
          kubectl -n linkly-dev rollout status deployment/linkly-api --timeout=180s
          wait $load
          echo "failed requests during rollout: $(cat /tmp/fails)"
          test "$(cat /tmp/fails)" -eq 0
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get all,netpol,pvc -n linkly-dev -o wide
          kubectl get events -n linkly-dev --sort-by=.lastTimestamp | tail -40
          kubectl -n linkly-dev logs deploy/linkly-api --tail=100 || true
          kubectl -n linkly-dev logs deploy/linkly-web --tail=50 || true
          cat /tmp/pf.log || true
